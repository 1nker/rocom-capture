name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            use_zig: true
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            use_zig: true
          - os: darwin
            arch: arm64
            runs-on: macos-14
            goos: darwin
            goarch: arm64
            use_zig: false

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装 Go 环境 (建议使用 stable 自动获取最新稳定版，避免手动猜版本号导致 404)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # 2. 安装 Node.js 环境 (构建前端)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 3. 安装 Zig (仅 Linux 交叉编译需要)
      - name: Set up Zig
        if: matrix.use_zig
        uses: mlugg/setup-zig@v1
        with:
          version: '0.13.0'

      # 4. 构建前端
      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      # 5. 编译 Go 二进制
      - name: Build Go Binary (Zig cross-compile)
        if: matrix.use_zig
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: zig cc -target ${{ matrix.zig_target }}
          CXX: zig c++ -target ${{ matrix.zig_target }}
        run: |
          mkdir -p dist
          go mod tidy
          go build -ldflags="-s -w" -o dist/rocom-capture-${{ matrix.os }}-${{ matrix.arch }} ./cmd/rocom-capture

      - name: Build Go Binary (native)
        if: ${{ !matrix.use_zig }}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go mod tidy
          go build -ldflags="-s -w" -o dist/rocom-capture-${{ matrix.os }}-${{ matrix.arch }} ./cmd/rocom-capture

      # 6. 上传构建产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocom-capture-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rocom-capture-*

  update-embed:
    name: Update embedded frontend
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Commit and push embedded frontend
        run: |
          if [ -z "$(git status --porcelain -- internal/server/web)" ]; then
            echo "No changes in internal/server/web"
            exit 0
          fi
          git add internal/server/web
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: rebuild embedded frontend'
          git push origin HEAD:${{ github.ref_name }}
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write 

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact-dir

      - name: Display structure of downloaded files
        run: ls -R artifact-dir

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact-dir/rocom-capture-linux-amd64/rocom-capture-linux-amd64
            artifact-dir/rocom-capture-linux-arm64/rocom-capture-linux-arm64
            artifact-dir/rocom-capture-darwin-arm64/rocom-capture-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
